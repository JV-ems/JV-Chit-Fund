  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // EXCEL EXPORT HELPER FUNCTIONS
    // ==========================================
    function exportCustomersToExcel(customers, config, version, partnerName = null) {
      if (!window.XLSX) return alert("Excel export library not loaded. Please check internet connection.");

      const filteredCustomers = partnerName && partnerName !== 'All' ? customers.filter(c => c.referral === partnerName) : customers;

      const headers = [
        "S.No", "Customer Name", "Mobile Number", "Referral Partner", "JV Version", "Chit Plan (Rs.)"
      ];

      (config.months || []).forEach((m, idx) => {
        headers.push(`M${idx+1} - ${m.name || `Month ${idx+1}`}`);
      });

      headers.push("Total Paid Months", "Auction Withdrawn?", "Withdrawal Date", "Disbursed By Partner", "Auction Amount (Rs.)");

      const rows = [headers];

      filteredCustomers.forEach(c => {
        let paidCount = 0;
        const row = [
          c.sno || 1,
          c.name || '',
          c.mobile || '',
          c.referral || '',
          c.version || version,
          c.schemeType || ''
        ];

        (config.months || []).forEach((m, idx) => {
          const pay = c.payments && c.payments[idx];
          if (pay && pay.isPaid) {
            paidCount++;
            row.push(pay.paidDate || 'Paid');
          } else {
            row.push('Unpaid');
          }
        });

        row.push(
          paidCount,
          (c.withdrawal && c.withdrawal.isWithdrawn) ? 'YES' : 'NO',
          (c.withdrawal && c.withdrawal.withdrawDate) || '-',
          (c.withdrawal && c.withdrawal.disbursedBy) || '-',
          (c.withdrawal && c.withdrawal.amount) || '-'
        );

        rows.push(row);
      });

      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `${version}_Customers`);
      const fileName = partnerName && partnerName !== 'All' 
        ? `JV_${version}_${partnerName}_Customers_${new Date().toISOString().split('T')[0]}.xlsx`
        : `JV_${version}_All_Customers_${new Date().toISOString().split('T')[0]}.xlsx`;
      XLSX.writeFile(wb, fileName);
    }

    async function exportAccountsToExcel(version, monthIndex, config, partnerFilter = null) {
      if (!window.XLSX) return alert("Excel export library not loaded.");

      try {
        const res = await fetch(`/api/accounts/summary?version=${version}&monthIndex=${monthIndex}`);
        const data = await res.json();
        if (!data.success) return alert("Failed to fetch accounts data");

        const summary = data.summary;
        const wb = XLSX.utils.book_new();

        // Sheet 1: Partner Balance Sheet
        const balHeaders = ["Referral Partner", "Opening Balance (Rs.)", "Collections (CR Rs.)", "Inward Transfers (Rs.)", "Outside CR (Rs.)", "Auction Payouts (DR Rs.)", "Outward Transfers (Rs.)", "Outside DR (Rs.)", "Closing Balance (Rs.)", "Status"];
        const balRows = [balHeaders];

        const partnersToInclude = partnerFilter && partnerFilter !== 'All' 
          ? summary.partnerBalances.filter(p => p.referral === partnerFilter) 
          : summary.partnerBalances;

        partnersToInclude.forEach(p => {
          balRows.push([
            p.referral,
            p.openingBalance || 0,
            p.collectionsCR || 0,
            p.transfersIn || 0,
            p.outsideCR || 0,
            p.disbursalsDR || 0,
            p.transfersOut || 0,
            p.outsideDR || 0,
            p.closingBalance || 0,
            p.closingBalance === 0 ? "Balanced (Rs. 0)" : (p.closingBalance > 0 ? "Cash in Hand (Surplus)" : "Advance Paid (Deficit)")
          ]);
        });

        if (!partnerFilter || partnerFilter === 'All') {
          balRows.push([
            "MONTH TOTAL",
            "-",
            summary.collectionsCR || 0,
            "-",
            summary.outsideCR || 0,
            summary.disbursalsDR || 0,
            "-",
            summary.outsideDR || 0,
            summary.masterNetDifference || 0,
            summary.isMasterTallied ? (summary.isZeroNet ? "0 TALLIED (ZERO NET BALANCED)" : `0 TALLIED (BALANCED: NET RS. ${summary.masterNetDifference})`) : `DISCREPANCY (DIFF: Rs. ${Math.abs((summary.partnerClosingSum || 0) - summary.masterNetDifference)})`
          ]);
        }

        const wsBal = XLSX.utils.aoa_to_sheet(balRows);
        XLSX.utils.book_append_sheet(wb, wsBal, "Balance_Sheet");

        // Sheet 2: Outside Transactions Spotlight
        const outHeaders = ["Transfer ID", "Type", "Partner Involved", "Outside Person / Party", "Amount (Rs.)", "Date", "Notes"];
        const outRows = [outHeaders];
        (summary.outsideTransactions || []).forEach(t => {
          outRows.push([
            t.id,
            t.entryType || (t.fromReferral === 'Others' ? 'CREDIT (INWARD)' : 'DEBIT (OUTWARD)'),
            t.fromReferral === 'Others' ? t.toReferral : t.fromReferral,
            t.outsidePersonName || 'Outside Party',
            t.amount,
            t.date,
            t.notes || ''
          ]);
        });
        const wsOut = XLSX.utils.aoa_to_sheet(outRows);
        XLSX.utils.book_append_sheet(wb, wsOut, "Outside_Party_Transactions");

        // Sheet 3: Fund Transfers Ledger
        const trfHeaders = ["Transfer ID", "Type", "From Party", "To Party", "Is Outside?", "Amount (Rs.)", "Date", "Notes"];
        const trfRows = [trfHeaders];
        (summary.transfers || [])
          .filter(t => !partnerFilter || partnerFilter === 'All' || t.fromReferral === partnerFilter || t.toReferral === partnerFilter)
          .forEach(t => {
            const sender = t.fromReferral === 'Others' ? `Others (${t.outsidePersonName || 'External'})` : t.fromReferral;
            const dest = t.toReferral === 'Others' ? `Others (${t.outsidePersonName || 'External'})` : t.toReferral;
            trfRows.push([t.id, t.entryType || 'TRANSFER', sender, dest, t.isOutside ? 'YES (OUTSIDE)' : 'NO', t.amount, t.date, t.notes || '']);
          });
        const wsTrf = XLSX.utils.aoa_to_sheet(trfRows);
        XLSX.utils.book_append_sheet(wb, wsTrf, "All_Transfers");

        // Sheet 4: Disbursals
        const disbHeaders = ["Disbursal ID", "Customer Name", "Disbursed By Partner", "Amount (Rs.)", "Date", "Notes"];
        const disbRows = [disbHeaders];
        (summary.disbursals || [])
          .filter(d => !partnerFilter || partnerFilter === 'All' || d.disbursedBy === partnerFilter)
          .forEach(d => {
            disbRows.push([d.id, d.customerName, d.disbursedBy, d.amount, d.date, d.notes || '']);
          });
        const wsDisb = XLSX.utils.aoa_to_sheet(disbRows);
        XLSX.utils.book_append_sheet(wb, wsDisb, "Auction_Disbursals_DR");

        const mName = summary.monthInfo ? (summary.monthInfo.name || `Month_${monthIndex+1}`) : `Month_${monthIndex+1}`;
        const prefix = partnerFilter && partnerFilter !== 'All' ? `${partnerFilter}_` : '';
        XLSX.writeFile(wb, `JV_${version}_${prefix}Accounts_${mName}_${new Date().toISOString().split('T')[0]}.xlsx`);
      } catch(e) {
        alert("Error generating accounts excel file");
      }
    }

        if (!data.success) return alert("Failed to fetch master balance sheet");

        const summary = data.summary;
        const wb = XLSX.utils.book_new();

        // Sheet 1: Master Balance Sheet
        const balHeaders = ["Referral Partner", "Opening Balance (Rs.)", "Collections (CR Rs.)", "Inward Transfers (Rs.)", "Outside CR (Rs.)", "Auction Payouts (DR Rs.)", "Outward Transfers (Rs.)", "Outside DR (Rs.)", "Closing Balance (Rs.)", "Status"];
        const balRows = [balHeaders];

        (summary.partnerBalances || []).forEach(p => {
          balRows.push([
            p.referral,
            p.openingBalance || 0,
            p.collectionsCR || 0,
            p.transfersIn || 0,
            p.outsideCR || 0,
            p.disbursalsDR || 0,
            p.transfersOut || 0,
            p.outsideDR || 0,
            p.closingBalance || 0,
            p.closingBalance === 0 ? "Balanced (Rs. 0)" : (p.closingBalance > 0 ? "Cash in Hand (Surplus)" : "Advance Paid (Deficit)")
          ]);
        });

        balRows.push([
          `MASTER SYSTEM TOTAL (${version.replace('_', ' ')})`,
          "-",
          summary.collectionsCR || 0,
          "-",
          summary.outsideCR || 0,
          summary.disbursalsDR || 0,
          "-",
          summary.outsideDR || 0,
          summary.masterNetDifference || 0,
          summary.isMasterTallied ? (summary.isZeroNet ? "0 TALLIED (ZERO NET BALANCED)" : `0 TALLIED (BALANCED: NET RS. ${summary.masterNetDifference})`) : `DISCREPANCY (DIFF: Rs. ${Math.abs((summary.partnerClosingSum || 0) - summary.masterNetDifference)})`
        ]);

        const wsBal = XLSX.utils.aoa_to_sheet(balRows);
        XLSX.utils.book_append_sheet(wb, wsBal, "Master_Balance_Sheet");

        // Sheet 2: Outside Transactions
        const outHeaders = ["Transfer ID", "Entry Type", "Partner Involved", "Outside Party / Person", "Amount (Rs.)", "Date", "Notes"];
        const outRows = [outHeaders];
        (summary.outsideTransactions || []).forEach(t => {
          outRows.push([
            t.id,
            t.entryType || (t.fromReferral === 'Others' ? 'CREDIT (INWARD)' : 'DEBIT (OUTWARD)'),
            t.fromReferral === 'Others' ? t.toReferral : t.fromReferral,
            t.outsidePersonName || 'Outside Party',
            t.amount,
            t.date,
            t.notes || ''
          ]);
        });
        const wsOut = XLSX.utils.aoa_to_sheet(outRows);
        XLSX.utils.book_append_sheet(wb, wsOut, "Outside_Party_Ledger");

        // Sheet 3: Complete Cashbook
        const trfHeaders = ["Transfer ID", "Type", "From Party", "To Party", "Is Outside?", "Amount (Rs.)", "Date", "Notes"];
        const trfRows = [trfHeaders];
        (summary.transfers || []).forEach(t => {
          const sender = t.fromReferral === 'Others' ? `Others (${t.outsidePersonName || 'External'})` : t.fromReferral;
          const dest = t.toReferral === 'Others' ? `Others (${t.outsidePersonName || 'External'})` : t.toReferral;
          trfRows.push([t.id, t.entryType || 'TRANSFER', sender, dest, t.isOutside ? 'YES (OUTSIDE)' : 'NO', t.amount, t.date, t.notes || '']);
        });
        const wsTrf = XLSX.utils.aoa_to_sheet(trfRows);
        XLSX.utils.book_append_sheet(wb, wsTrf, "Cashbook_Transfers");

        // Sheet 4: Auction Payouts
        const disbHeaders = ["Disbursal ID", "Customer Name", "Disbursed By Partner", "Amount (Rs.)", "Date", "Notes"];
        const disbRows = [disbHeaders];
        (summary.disbursals || []).forEach(d => {
          disbRows.push([d.id, d.customerName, d.disbursedBy, d.amount, d.date, d.notes || '']);
        });
        const wsDisb = XLSX.utils.aoa_to_sheet(disbRows);
        XLSX.utils.book_append_sheet(wb, wsDisb, "Auction_Disbursals_DR");

        XLSX.writeFile(wb, `JV_Master_Balance_Sheet_${version}_M${parseInt(monthIndex)+1}_${new Date().toISOString().split('T')[0]}.xlsx`);
      } catch(e) {
        alert("Error generating master balance sheet excel");
      }
    }

    async function exportMasterConsolidatedExcel() {
      if (!window.XLSX) return alert("Excel export library not loaded.");
      try {
        const res = await fetch('/api/master/consolidated-summary');
        const data = await res.json();
        if (!data.success) return alert("Failed to fetch master summary");

        const wb = XLSX.utils.book_new();

        const pHeaders = ["Referral Partner", "Total Customers (All Versions)", "Total Collections CR (Rs.)", "Total Payouts DR (Rs.)", "Net Balance (Rs.)", "Pending Members", "Withdrawn Members"];
        const pRows = [pHeaders];
        data.summary.partnerOverview.forEach(p => {
          pRows.push([
            p.referral,
            p.totalCustomers,
            p.totalCR,
            p.totalDR,
            p.totalCR - p.totalDR,
            p.pendingCount,
            p.withdrawnCount
          ]);
        });
        pRows.push([
          "ALL-JV OVERALL TOTAL",
          data.summary.totalAllCustomers,
          data.summary.overallAllJVCR,
          data.summary.overallAllJVDR,
          data.summary.netAllJVBalance,
          "-",
          data.summary.totalAllWithdrawn
        ]);

        const wsOverview = XLSX.utils.aoa_to_sheet(pRows);
        XLSX.utils.book_append_sheet(wb, wsOverview, "Master_All_JV_Overview");

        XLSX.writeFile(wb, `JV_Master_Consolidated_Financial_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
      } catch (e) {
        alert("Error generating master excel");
      }
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem('jv_logged_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) { return null; }
      });

      const [configs, setConfigs] = useState(window.CHIT_CONFIGS || {});
      const [coreReferrals, setCoreReferrals] = useState(window.CORE_REFERRALS || ['PLSSV', 'Arun', 'Varatha', 'Ramana', 'Vicky']);
      const isMasterAdmin = user && user.role === 'admin' && user.username === 'admin';
      const isPartnerAdmin = user && user.role === 'admin' && user.username !== 'admin';

      const [selectedVersion, setSelectedVersion] = useState(isMasterAdmin ? 'Overall' : 'JV_1.0');
      const [currentTab, setCurrentTab] = useState(isMasterAdmin ? 'master_overview' : 'passbook');

      const [customers, setCustomers] = useState([]);
      const [isLoading, setIsLoading] = useState(false);

      useEffect(() => {
        fetch('/api/config')
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              setConfigs(data.configs);
              setCoreReferrals(data.coreReferrals);
            }
          })
          .catch(e => console.log("Using local config matrix"));
      }, []);

      const loadCustomers = async () => {
        if (!user) return;
        setIsLoading(true);
        try {
          const fetchVer = (selectedVersion === 'Overall') ? 'JV_1.0' : selectedVersion;
          const res = await fetch(`/api/customers?version=${fetchVer}`);
          const data = await res.json();
          if (data.success) {
            setCustomers(data.customers);
          }
        } catch (e) {
          console.error("Error loading customers", e);
        }
        setIsLoading(false);
      };

      useEffect(() => {
        if (user) {
          loadCustomers();
        }
      }, [user, selectedVersion]);

      const handleLoginSuccess = (loggedInUser, customerData) => {
        setUser(loggedInUser);
        localStorage.setItem('jv_logged_user', JSON.stringify(loggedInUser));
        if (loggedInUser.username === 'admin') {
          setSelectedVersion('Overall');
          setCurrentTab('master_overview');
        } else {
          setSelectedVersion('JV_1.0');
          setCurrentTab('passbook');
        }
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem('jv_logged_user');
      };

      if (!user) {
        return (
          <LoginScreen
            coreReferrals={coreReferrals}
            onLoginSuccess={handleLoginSuccess}
          />
        );
      }

      const [showChangePassModal, setShowChangePassModal] = useState(false);

      const activeConfig = configs[selectedVersion] || configs['JV_1.0'] || configs['JV_3.0'] || {};
      const versionOptions = isMasterAdmin ? ['Overall', ...Object.keys(configs)] : Object.keys(configs);

      return (
        <div className="app-container fade-in">
          {showChangePassModal && (
            <ChangePasswordModal
              user={user}
              onClose={() => setShowChangePassModal(false)}
            />
          )}

          {/* Top Navbar Header */}
          <div className="header-nav">
            <div className="logo-area">
              <img src="assests/logo.png" alt="JayanVijayan Logo" className="app-brand-logo" />
              <div className="logo-text-group">
                <h1>JV Chit Fund</h1>
                <p>{selectedVersion === 'Overall' ? 'Overall All-JV Overview' : (activeConfig.welcomeText || selectedVersion)} • Since {activeConfig.since || '2025'}</p>
              </div>
            </div>

            <div className="controls">
              <div className={`user-badge ${isMasterAdmin ? 'master-admin-badge' : ''}`}>
                <span>{isMasterAdmin ? '👑' : '👤'}</span>
                <span>
                  {isMasterAdmin ? 'JV Admin Panel' : `${user.username || user.name}`}
                </span>
              </div>

              <button
                type="button"
                onClick={() => setShowChangePassModal(true)}
                style={{ background: '#f1f5f9', color: '#0b1f3a', border: '1px solid #cbd5e1', cursor: 'pointer', padding: '6px 12px', borderRadius: '6px', fontSize: '13px', fontWeight: '600', display: 'inline-flex', alignItems: 'center', gap: '4px' }}
              >
                🔒 Change Password
              </button>

              <button className="danger" onClick={handleLogout}>
                🚪 Logout
              </button>
            </div>
          </div>


          {/* Version Selector */}
          {user.role === 'admin' && (
            <div className="version-bar">
              <strong style={{ color: '#0b1f3a', fontSize: '14px', marginRight: '6px' }}>Chit Scheme Version:</strong>
              {versionOptions.map(v => (
                <div
                  key={v}
                  className={`version-pill ${selectedVersion === v ? 'active' : ''}`}
                  onClick={() => setSelectedVersion(v)}
                >
                  {v === 'Overall' ? '🌐 Overall' : `✨ ${v}`}
                </div>
              ))}
            </div>
          )}

          {/* Navigation Tabs based on Role */}
          <div className="tabs" style={{ marginBottom: '22px' }}>
            {/* MASTER ADMIN TABS (Overview, Partner Inspector, Master Accounts) */}
            {isMasterAdmin && (
              <>
                <button
                  className={`tabbtn ${currentTab === 'master_overview' ? 'active' : ''}`}
                  onClick={() => setCurrentTab('master_overview')}
                >
                  🏢 JV Admin Overview
                </button>
                <button
                  className={`tabbtn ${currentTab === 'partner_inspector' ? 'active' : ''}`}
                  onClick={() => setCurrentTab('partner_inspector')}
                  style={{ background: currentTab === 'partner_inspector' ? '#059669' : '#ffffff', color: currentTab === 'partner_inspector' ? '#ffffff' : '#059669' }}
                >
                  👥 Person Inspector
                </button>
                <button
                  className={`tabbtn ${currentTab === 'master_accounts' ? 'active' : ''}`}
                  onClick={() => setCurrentTab('master_accounts')}
                  style={{ background: currentTab === 'master_accounts' ? '#4f46e5' : '#ffffff', color: currentTab === 'master_accounts' ? '#ffffff' : '#4f46e5' }}
                >
                  📒 JV Admin Balance Sheet
                </button>
              </>
            )}

            {/* INDIVIDUAL REFERRAL PARTNER TABS */}
            {isPartnerAdmin && (
              <>
                <button
                  className={`tabbtn ${currentTab === 'passbook' ? 'active' : ''}`}
                  onClick={() => setCurrentTab('passbook')}
                >
                  📖 Customer's Records ({user.referral})
                </button>
                <button
                  className={`tabbtn ${currentTab === 'accounts' ? 'active' : ''}`}
                  onClick={() => setCurrentTab('accounts')}
                  style={{ background: currentTab === 'accounts' ? '#059669' : '#ffffff', color: currentTab === 'accounts' ? '#ffffff' : '#059669' }}
                >
                  📒 My Balance Sheet ({user.referral})
                </button>
                <button
                  className={`tabbtn ${currentTab === 'add_customer' ? 'active' : ''}`}
                  onClick={() => setCurrentTab('add_customer')}
                >
                  ➕ Add Customer
                </button>
                <button
                  className={`tabbtn ${currentTab === 'payment_admin' ? 'active' : ''}`}
                  onClick={() => setCurrentTab('payment_admin')}
                >
                  ✍️ Record Payment
                </button>
                <button
                  className={`tabbtn ${currentTab === 'reports' ? 'active' : ''}`}
                  onClick={() => setCurrentTab('reports')}
                >
                  📊 Scheme Report
                </button>
              </>
            )}

            {/* CUSTOMER TAB */}
            {user.role === 'customer' && (
              <button className="tabbtn active">
                📖 Customer's Records
              </button>
            )}
          </div>

          {/* Main View Container */}
          <div className="view-container">
            {/* 1. MASTER ADMIN OVERVIEW */}
            {currentTab === 'master_overview' && isMasterAdmin && (
              <MasterAdminOverviewView
                config={activeConfig}
                version={selectedVersion}
                coreReferrals={coreReferrals}
              />
            )}

            {/* 2. MASTER ADMIN PARTNER INSPECTOR */}
            {currentTab === 'partner_inspector' && isMasterAdmin && (
              <MasterPartnerInspectorView
                configs={configs}
                coreReferrals={coreReferrals}
                version={selectedVersion}
              />
            )}

            {/* 2B. MASTER ACCOUNTS & BALANCE SHEET */}
            {currentTab === 'master_accounts' && isMasterAdmin && (
              <MasterAccountsBalanceSheetView
                configs={configs}
                coreReferrals={coreReferrals}
                version={selectedVersion}
              />
            )}

            {/* 3. PASSBOOK VIEW */}
            {currentTab === 'passbook' && (
              <CustomerPassbookView
                user={user}
                config={activeConfig}
                version={selectedVersion}
                customers={customers}
                coreReferrals={coreReferrals}
              />
            )}

            {/* 4. ADD CUSTOMER */}
            {currentTab === 'add_customer' && user.role === 'admin' && (
              <AddCustomerView
                user={user}
                configs={configs}
                selectedVersion={selectedVersion}
                setSelectedVersion={setSelectedVersion}
                coreReferrals={coreReferrals}
                onCustomerAdded={() => {
                  loadCustomers();
                  setCurrentTab('passbook');
                }}
              />
            )}

            {/* 5. PAYMENT ADMIN */}
            {currentTab === 'payment_admin' && user.role === 'admin' && (
              <AdminPaymentUpdatesView
                user={user}
                config={activeConfig}
                version={selectedVersion}
                customers={customers}
                coreReferrals={coreReferrals}
                refreshData={loadCustomers}
              />
            )}

            {/* 6. INDIVIDUAL PARTNER BALANCE SHEET */}
            {currentTab === 'accounts' && isPartnerAdmin && (
              <PartnerIndividualBalanceSheetView
                user={user}
                config={activeConfig}
                version={selectedVersion}
                coreReferrals={coreReferrals}
              />
            )}

            {/* 7. REPORTS */}
            {currentTab === 'reports' && user.role === 'admin' && (
              <ReportsView
                user={user}
                config={activeConfig}
                version={selectedVersion}
                coreReferrals={coreReferrals}
              />
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // CHANGE PASSWORD MODAL
    // ==========================================
    function ChangePasswordModal({ user, onClose }) {
      const [oldPassword, setOldPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [msg, setMsg] = useState('');
      const [err, setErr] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setMsg('');
        setErr('');

        if (newPassword !== confirmPassword) {
          setErr('New password and Confirm password do not match.');
          return;
        }

        if (newPassword.length < 4) {
          setErr('Password must be at least 4 characters long.');
          return;
        }

        setIsLoading(true);

        try {
          const res = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: user.username || user.mobile || user.referral,
              oldPassword,
              newPassword
            })
          });
          const data = await res.json();
          if (data.success) {
            setMsg('Password updated successfully in database!');
            setOldPassword('');
            setNewPassword('');
            setConfirmPassword('');
            setTimeout(() => {
              onClose();
            }, 1500);
          } else {
            setErr(data.message || 'Failed to change password.');
          }
        } catch (e) {
          setErr('Server error connecting to API');
        }
        setIsLoading(false);
      };

      return (
        <div className="modal-backdrop fade-in" style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9999 }}>
          <div className="modal-card" style={{ background: '#fff', padding: '24px', borderRadius: '12px', width: '360px', maxWidth: '90%', boxShadow: '0 10px 25px rgba(0,0,0,0.2)' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
              <h3 style={{ margin: 0, color: '#0b1f3a', fontSize: '18px' }}>🔑 Change Password</h3>
              <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: '18px', cursor: 'pointer' }}>✖</button>
            </div>

            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
              <div className="form-group">
                <label style={{ fontSize: '12px', fontWeight: '600', color: '#475569' }}>User Identity</label>
                <input type="text" value={user.username || user.name || user.referral} disabled style={{ background: '#f1f5f9', cursor: 'not-allowed' }} />
              </div>

              <div className="form-group">
                <label style={{ fontSize: '12px', fontWeight: '600', color: '#475569' }}>Current Password</label>
                <input
                  type="password"
                  placeholder="Enter current password"
                  value={oldPassword}
                  onChange={e => setOldPassword(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <label style={{ fontSize: '12px', fontWeight: '600', color: '#475569' }}>New Password</label>
                <input
                  type="password"
                  placeholder="Enter new password"
                  value={newPassword}
                  onChange={e => setNewPassword(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <label style={{ fontSize: '12px', fontWeight: '600', color: '#475569' }}>Confirm New Password</label>
                <input
                  type="password"
                  placeholder="Confirm new password"
                  value={confirmPassword}
                  onChange={e => setConfirmPassword(e.target.value)}
                  required
                />
              </div>

              {msg && (
                <div style={{ color: '#15803d', background: '#dcfce7', padding: '10px 14px', borderRadius: '8px', fontSize: '13px', fontWeight: '600' }}>
                  ✅ {msg}
                </div>
              )}

              {err && (
                <div style={{ color: '#dc2626', background: '#fee2e2', padding: '10px 14px', borderRadius: '8px', fontSize: '13px', fontWeight: '600' }}>
                  ⚠️ {err}
                </div>
              )}

              <div style={{ display: 'flex', gap: '10px', marginTop: '8px' }}>
                <button type="button" onClick={onClose} style={{ flex: 1, background: '#e2e8f0', color: '#334155', border: 'none', padding: '10px', borderRadius: '6px', cursor: 'pointer', fontWeight: '600' }}>
                  Cancel
                </button>
                <button type="submit" disabled={isLoading} style={{ flex: 1, background: '#0b1f3a', color: '#fff', border: 'none', padding: '10px', borderRadius: '6px', cursor: 'pointer', fontWeight: '600' }}>
                  {isLoading ? 'Updating...' : 'Update Password'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // LOGIN SCREEN
    // ==========================================
    function LoginScreen({ coreReferrals, onLoginSuccess }) {
      const [adminUser, setAdminUser] = useState(coreReferrals[0] || 'PLSSV');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      // Forgot Password State
      const [isForgotPass, setIsForgotPass] = useState(false);
      const [forgotUser, setForgotUser] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmNewPassword, setConfirmNewPassword] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');
        setIsLoading(true);

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: adminUser, password })
          });
          const data = await res.json();
          if (data.success) {
            onLoginSuccess(data.user, data.customer);
          } else {
            setErrorMsg(data.message || 'Invalid login details');
          }
        } catch (e) {
          setErrorMsg('Server connection failed. Make sure node server is running.');
        }
        setIsLoading(false);
      };

      const handleForgotPassword = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');

        if (newPassword !== confirmNewPassword) {
          setErrorMsg('New password and Confirm password do not match.');
          return;
        }

        if (newPassword.length < 4) {
          setErrorMsg('Password must be at least 4 characters long.');
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: forgotUser, newPassword })
          });
          const data = await res.json();
          if (data.success) {
            setSuccessMsg('Password updated successfully in database! You can now log in.');
            setForgotUser('');
            setNewPassword('');
            setConfirmNewPassword('');
            setTimeout(() => {
              setIsForgotPass(false);
              setSuccessMsg('');
            }, 2000);
          } else {
            setErrorMsg(data.message || 'Password reset failed.');
          }
        } catch (e) {
          setErrorMsg('Server error connecting to API');
        }
        setIsLoading(false);
      };

      if (isForgotPass) {
        return (
          <div className="login-screen">
            <div className="login-card fade-in">
              <img src="assests/logo.png" alt="JV Logo" style={{ width: '84px', height: '84px', borderRadius: '50%', border: '3px solid #d4af37', boxShadow: '0 6px 20px rgba(212, 175, 55, 0.35)', margin: '0 auto 12px auto' }} />
              <h2>Reset Password</h2>
              <p>Update credentials directly in MongoDB database</p>

              <form onSubmit={handleForgotPassword} style={{ display: 'flex', flexDirection: 'column', gap: '14px', textAlign: 'left', marginTop: '16px' }}>
                <div className="form-group">
                  <label>Username / Mobile Number</label>
                  <input
                    type="text"
                    placeholder="Enter Username or Mobile (e.g. PLSSV, admin, 9876543210)"
                    value={forgotUser}
                    onChange={e => setForgotUser(e.target.value)}
                    required
                  />
                </div>

                <div className="form-group">
                  <label>New Password</label>
                  <input
                    type="password"
                    placeholder="Enter new password"
                    value={newPassword}
                    onChange={e => setNewPassword(e.target.value)}
                    required
                  />
                </div>

                <div className="form-group">
                  <label>Confirm New Password</label>
                  <input
                    type="password"
                    placeholder="Confirm new password"
                    value={confirmNewPassword}
                    onChange={e => setConfirmNewPassword(e.target.value)}
                    required
                  />
                </div>

                {successMsg && (
                  <div style={{ color: '#15803d', background: '#dcfce7', padding: '10px 14px', borderRadius: '8px', fontSize: '13px', fontWeight: '700' }}>
                    ✅ {successMsg}
                  </div>
                )}

                {errorMsg && (
                  <div style={{ color: '#dc2626', background: '#fee2e2', padding: '10px 14px', borderRadius: '8px', fontSize: '13px', fontWeight: '700' }}>
                    ⚠️ {errorMsg}
                  </div>
                )}

                <button type="submit" disabled={isLoading} style={{ marginTop: '6px', padding: '12px' }}>
                  {isLoading ? 'Resetting Password...' : 'Reset Password in DB'}
                </button>

                <button type="button" onClick={() => { setIsForgotPass(false); setErrorMsg(''); setSuccessMsg(''); }} style={{ background: 'none', border: 'none', color: '#0b1f3a', cursor: 'pointer', fontSize: '13px', fontWeight: '600', textDecoration: 'underline', marginTop: '4px' }}>
                  ← Back to Sign In
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="login-screen">
          <div className="login-card fade-in">
            <img src="assests/logo.png" alt="JV Logo" style={{ width: '84px', height: '84px', borderRadius: '50%', border: '3px solid #d4af37', boxShadow: '0 6px 20px rgba(212, 175, 55, 0.35)', margin: '0 auto 12px auto' }} />
            <h2>JV Chit Fund</h2>
            <p>Save Monthly, Grow Yearly</p>

            <form onSubmit={handleLogin} style={{ display: 'flex', flexDirection: 'column', gap: '16px', textAlign: 'left', marginTop: '16px' }}>
              <div className="form-group">
                <label>Choose Login Identity</label>
                <select value={adminUser} onChange={e => setAdminUser(e.target.value)}>
                  <optgroup label="👑 JV Administrator">
                    <option value="admin">JV Admin</option>
                  </optgroup>
                  <optgroup label="👤 Persons">
                    {coreReferrals.map(r => <option key={r} value={r}>{r}</option>)}
                  </optgroup>
                </select>
              </div>

              <div className="form-group">
                <label>Password</label>
                <input
                  type="password"
                  placeholder="Enter password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  required
                />
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '4px' }}>
                  <small style={{ color: '#64748b', fontSize: '11px' }}>
                    {adminUser === 'admin' ? 'Default: admin123' : 'Partner Default: 1234'}
                  </small>
                  <button type="button" onClick={() => { setIsForgotPass(true); setErrorMsg(''); setSuccessMsg(''); }} style={{ background: 'none', border: 'none', color: '#2563eb', cursor: 'pointer', fontSize: '11px', fontWeight: '600', textDecoration: 'underline', padding: 0 }}>
                    Forgot Password?
                  </button>
                </div>
              </div>

              {errorMsg && (
                <div style={{ color: '#dc2626', background: '#fee2e2', padding: '10px 14px', borderRadius: '8px', fontSize: '13px', fontWeight: '700' }}>
                  ⚠️ {errorMsg}
                </div>
              )}

              <button type="submit" disabled={isLoading} style={{ marginTop: '8px', padding: '12px' }}>
                {isLoading ? 'Authenticating...' : 'Sign In'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function PartnerIndividualBalanceSheetView({ user, config, version, coreReferrals }) {
      const partnerName = user.referral || 'PLSSV';
      const [selectedMonthIndex, setSelectedMonthIndex] = useState(0);
      const [summary, setSummary] = useState(null);
      const [breakdown, setBreakdown] = useState(null);
      const [isLoading, setIsLoading] = useState(true);

      // Form state for dual Credit / Debit entries
      const [entryType, setEntryType] = useState('DR'); // 'CR' (Receive) or 'DR' (Send)
      const otherPartners = coreReferrals.filter(r => r !== partnerName);
      const [selectedParty, setSelectedParty] = useState(otherPartners[0] || 'Others');
      const [outsidePersonName, setOutsidePersonName] = useState('');
      const [transferAmount, setTransferAmount] = useState('');
      const [transferNotes, setTransferNotes] = useState('');
      const [transferDate, setTransferDate] = useState(new Date().toISOString().split('T')[0]);
      const [transferMsg, setTransferMsg] = useState('');

      const fetchSummary = () => {
        setIsLoading(true);
        Promise.all([
          fetch(`/api/accounts/summary?version=${version}&monthIndex=${selectedMonthIndex}`).then(r => r.json()),
          fetch(`/api/accounts/partner-breakdown?partner=${partnerName}&version=${version}`).then(r => r.json())
        ])
          .then(([summaryData, breakdownData]) => {
            if (summaryData.success) setSummary(summaryData.summary);
            if (breakdownData.success) setBreakdown(breakdownData.breakdown);
          })
          .catch(e => console.error(e))
          .finally(() => setIsLoading(false));
      };

      useEffect(() => {
        fetchSummary();
      }, [version, selectedMonthIndex]);

      const handleAddEntry = async (e) => {
        e.preventDefault();
        if (!transferAmount || parseFloat(transferAmount) <= 0) return alert("Enter valid amount");

        const isCR = entryType === 'CR';
        if (isCR && !outsidePersonName.trim()) {
          return alert("Please enter the Outside Person / Financier Name");
        }
        if (!isCR && selectedParty === 'Others' && !outsidePersonName.trim()) {
          return alert("Please enter the Outside Person / Vendor Name");
        }

        const fromReferral = isCR ? 'Others' : partnerName;
        const toReferral = isCR ? partnerName : selectedParty;
        const targetOtherName = isCR ? outsidePersonName.trim() : (selectedParty === 'Others' ? outsidePersonName.trim() : null);

        try {
          const res = await fetch('/api/accounts/transfers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              version,
              monthIndex: selectedMonthIndex,
              entryType,
              fromReferral,
              toReferral,
              otherPartyName: targetOtherName,
              otherRecipientName: (!isCR && selectedParty === 'Others') ? targetOtherName : null,
              otherSenderName: isCR ? targetOtherName : null,
              amount: parseFloat(transferAmount),
              date: transferDate,
              notes: transferNotes || (isCR ? `Outside inward credit from ${targetOtherName}` : `Outward payout to ${selectedParty === 'Others' ? targetOtherName : selectedParty}`)
            })
          });
          const data = await res.json();
          if (data.success) {
            setTransferMsg(`${isCR ? 'Credit (Inward)' : 'Debit (Outward)'} recorded successfully!`);
            setTransferAmount('');
            setTransferNotes('');
            setOutsidePersonName('');
            fetchSummary();
            setTimeout(() => setTransferMsg(''), 3500);
          }
        } catch (e) {
          alert("Error saving transaction");
        }
      };

      const handleDeleteTransfer = async (id) => {
        if (!confirm("Are you sure you want to delete this cash entry?")) return;
        await fetch('/api/accounts/transfers', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transferId: id })
        });
        fetchSummary();
      };

      const myBalance = summary ? (summary.partnerBalances.find(p => p.referral === partnerName) || {}) : {};
      const currentMonthObj = config.months && config.months[selectedMonthIndex];
      const monthLabel = currentMonthObj ? (currentMonthObj.name || `Month ${selectedMonthIndex + 1}`) : `Month ${selectedMonthIndex + 1}`;

      return (
        <div className="fade-in">
          {/* Top Title & Month Controls */}

    // ==========================================================================
    // ULTRA-ELEGANT & LUXURIOUS ROYAL PASSBOOK VIEW
    // ==========================================================================
    function CustomerPassbookView({ user, config, version, customers, coreReferrals }) {
      const isPartnerAdmin = user.role === 'admin' && user.username !== 'admin';
      const [selectedReferral, setSelectedReferral] = useState(
        isPartnerAdmin ? user.referral : (user.role === 'customer' ? user.referral : coreReferrals[0])
      );
      const [selectedCustomer, setSelectedCustomer] = useState(null);
      const [isDownloading, setIsDownloading] = useState(false);
      const printRef = useRef();

      const displayCustomers = user.role === 'customer'
        ? customers.filter(c => c.id === user.customerId || c.mobile === user.mobile)
        : (isPartnerAdmin 
            ? customers.filter(c => c.referral === user.referral)
            : (selectedReferral === 'All' ? customers : customers.filter(c => c.referral === selectedReferral)));

      const maskMobile = (num) => {
        if (!num) return '-';
        const str = String(num).trim();
        if (str.length <= 4) return str;
        return str.slice(0, 2) + 'X'.repeat(str.length - 4) + str.slice(-2);
      };

      useEffect(() => {
        if (displayCustomers.length > 0) {
          if (!selectedCustomer || !displayCustomers.find(c => c.id === selectedCustomer.id)) {
            setSelectedCustomer(displayCustomers[0]);
          }
        } else {
          setSelectedCustomer(null);
        }
      }, [selectedReferral, customers, version]);

      const handleDownload = async (format = 'jpg') => {
        const element = printRef.current;
        if (!element || isDownloading) return;
        setIsDownloading(true);

        try {
          // Ensure web fonts are completely loaded
          if (document.fonts) {
            await document.fonts.ready;
          }

          // Render high-definition canvas using isolated clone (never mutates the live on-screen element)
          const canvas = await html2canvas(element, {
            scale: 3, // Ultra-sharp 300 DPI print quality
            useCORS: true,
            allowTaint: true,
            logging: false,
            backgroundColor: "#ffffff",
            windowWidth: 1024, // Consistent desktop-proportioned layout
            onclone: (clonedDoc) => {
              const card = clonedDoc.querySelector('.chit-portrait-card');
              if (card) {
                card.style.width = "760px";
                card.style.maxWidth = "760px";
                card.style.margin = "0 auto";
                card.style.boxShadow = "none";
              }
            }
          });

          const isJpeg = format === 'jpg';
          const mimeType = isJpeg ? 'image/jpeg' : 'image/png';
          const quality = isJpeg ? 0.98 : undefined;
          const image = canvas.toDataURL(mimeType, quality);

          const link = document.createElement("a");
          link.href = image;
          const safeCustName = selectedCustomer ? selectedCustomer.name.replace(/[^a-zA-Z0-9_-]/g, '_') : 'Chit';
          link.download = `${safeCustName}_${version}_Passbook.${format}`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (e) {
          console.error("Passbook generation error:", e);
          alert("Error generating passbook image. Please try again.");
        } finally {
          setIsDownloading(false);
        }
      };

      const handlePrint = () => {
        window.print();
      };

      const schemeType = selectedCustomer ? selectedCustomer.schemeType : (Object.keys(config.schemes || {})[0] || '1250');
      const schemeDetails = (config.schemes && config.schemes[schemeType]) || (config.schemes && Object.values(config.schemes)[0]) || {};

      const refName = selectedCustomer ? selectedCustomer.referral : selectedReferral;
      let signatureSrc = "";
      if (refName === "PLSSV") signatureSrc = "assests/signature/PLSSV_Signature.png";
      else if (refName === "Arun") signatureSrc = "assests/signature/Arun_Signature.png";
      else if (refName === "Ramana") signatureSrc = "assests/signature/Ramana_Signature.png";
      const passbookBg = version === 'JV_1.0'
        ? 'linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #ecfdf5 100%)'
        : version === 'JV_2.0'
        ? 'linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #e0f2fe 100%)'
        : 'linear-gradient(135deg, #fffbe6 0%, #fef3c7 50%, #faf5ff 100%)';
