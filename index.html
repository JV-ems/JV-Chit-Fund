        ? '2px solid #86efac'
        : version === 'JV_2.0'
        ? '2px solid #93c5fd'
        : '2px solid #fde68a';

      return (
        <div>
          {/* Admin Referral Filters and Excel Export */}
          {user.role === 'admin' && (
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px', background: '#ffffff', padding: '12px 18px', borderRadius: '12px', marginBottom: '16px', border: '1.5px solid #e2e8f0' }}>
              <div className="tabs">
                <strong style={{ margin: 'auto 10px auto 0', color: '#0b1f3a' }}>Referral Partner:</strong>
                {isPartnerAdmin ? (
                  <span style={{ fontWeight: '900', color: '#0b1f3a', padding: '7px 14px', background: '#e0f2fe', borderRadius: '8px' }}>
                    👤 {user.referral}
                  </span>
                ) : (
                  <>
                    {coreReferrals.map(r => (
                      <button
                        key={r}
                        className={`tabbtn ${selectedReferral === r ? 'active' : ''}`}
                        onClick={() => setSelectedReferral(r)}
                      >
                        {r}
                      </button>
                    ))}
                    <button
                      className={`tabbtn ${selectedReferral === 'All' ? 'active' : ''}`}
                      onClick={() => setSelectedReferral('All')}
                    >
                      All Partners
                    </button>
                  </>
                )}
              </div>

              <button
                type="button"
                className="success"
                onClick={() => exportCustomersToExcel(customers, config, version, isPartnerAdmin ? user.referral : selectedReferral)}
                style={{ padding: '9px 18px', fontSize: '13px' }}
              >
                📊 Export Customers (Excel)
              </button>
            </div>
          )}

          {user.role === 'admin' && displayCustomers.length > 0 && (
            <div className="tabs" style={{ marginBottom: '22px', gap: '8px' }}>
              {displayCustomers.map(c => (
                <button
                  key={c.id}
                  className={`tabbtn ${selectedCustomer && selectedCustomer.id === c.id ? 'active' : ''}`}
                  style={{
                    backgroundColor: selectedCustomer && selectedCustomer.id === c.id ? '#0b1f3a' : '#ffffff',
                    color: selectedCustomer && selectedCustomer.id === c.id ? '#ffffff' : '#0b1f3a',
                    border: '1.5px solid #cbd5e1'
                  }}
                  onClick={() => setSelectedCustomer(c)}
                >
                  👤 {c.name} (Rs. {Number(c.schemeType).toLocaleString('en-IN')})
                </button>
              ))}
            </div>
          )}

          {!selectedCustomer ? (
            <div style={{ textAlign: 'center', padding: '50px 20px', color: '#64748b' }}>
              <h3>No customers found</h3>
              <p style={{ marginTop: '8px', fontSize: '14px' }}>Please add a customer under this version to view their passbook card.</p>
            </div>
          ) : (
            <div className="chit-portrait-wrapper">
              <div ref={printRef} className="chit-portrait-card" style={{ background: passbookBg, border: passbookBorder }}>
                {/* High-Res Watermark Logo */}
                <img src="assests/logo.png" className="passbook-big-watermark" alt="Watermark" crossOrigin="anonymous" />

                <div className="passbook-content-layer">
                  {/* Top Sacred Blessing */}
                  <div className="passbook-god-header">
                    ✨ {config.headerGreeting || 'ஸ்ரீ வரதராஜப் பரப்ரஹ்மணே நம:'} ✨
                  </div>

                  {/* Portrait Brand Header */}
                  <div className="passbook-portrait-header">
                    <img src="assests/logo.png" alt="JV Logo" className="passbook-crest-logo" crossOrigin="anonymous" />

                    <div className="passbook-brand-center">
                      <h1 className="passbook-brand-title">{config.title || 'JV CHIT FUND'}</h1>
                      <div className="passbook-brand-slogan">
                        <span>🪙</span>
                        <span>{config.slogan || 'Save Monthly, Grow Yearly 📈'}</span>
                      </div>
                    </div>

                    <div className="passbook-crest-badge">
                      <img src="assests/logo.png" alt="JV Logo" className="passbook-crest-logo" crossOrigin="anonymous" style={{ width: '56px', height: '56px' }} />
                      <div className="badge-version-gold" style={{ marginTop: '2px', fontSize: '11px', padding: '3px 10px' }}>{version.replace('_', ' ')}</div>
                    </div>
                  </div>

                  {/* Customer Information Strip */}
                  <div className="passbook-info-card">
                    <div className="info-item">
                      <span className="info-lbl">Customer Name:</span>
                      <span className="info-val">{selectedCustomer.name}</span>
                    </div>
                    <div className="info-item">
                      <span className="info-lbl">Mobile Number:</span>
                      <span className="info-val">{maskMobile(selectedCustomer.mobile)}</span>
                    </div>
                    <div className="info-item">
                      <span className="info-lbl">Referral Partner:</span>
                      <span className="info-val">{selectedCustomer.referral}</span>
                    </div>
                    <div className="info-item" style={{ textAlign: 'right' }}>
                      <span className="info-lbl">Chit Plan:</span>
                      <span className="info-val" style={{ color: '#b45309' }}>
                        Rs. {Number(selectedCustomer.schemeType).toLocaleString('en-IN')} Plan
                      </span>
                    </div>
                  </div>

                  {/* Portrait Passbook Table */}
                  <div className="portrait-table-box">
                    <table className="portrait-table">
                      <thead>
                        <tr>
                          <th style={{ width: '42px' }}>S.No</th>
                          <th>Month</th>
                          <th>Payable Amount</th>
                          <th>Withdraw Amount</th>
                          <th style={{ minWidth: '95px' }}>Paid Date</th>
                          <th style={{ minWidth: '90px' }}>Signature</th>
                        </tr>
                      </thead>
                      <tbody>
                        {config.months && config.months.map((mObj, idx) => {
                          const monthDisplayName = mObj.tamilName || mObj.name || `Month ${idx + 1}`;
                          const payItem = selectedCustomer.payments && selectedCustomer.payments[idx];
                          const isPaid = payItem && payItem.isPaid;
                          const paidDate = payItem && payItem.paidDate;

                          const monthlyPayable = (schemeDetails.monthlyPayable && schemeDetails.monthlyPayable[idx]) || schemeDetails.basePayable || selectedCustomer.schemeType;
                          const receivedAmt = (schemeDetails.received && schemeDetails.received[idx]) || '-';

                          return (
                            <tr key={idx} className={isPaid ? 'paid-row' : ''}>
                              <td style={{ fontWeight: '700' }}>{idx + 1}</td>
                              <td style={{ fontWeight: '800', fontSize: '12px' }}>{monthDisplayName}</td>
                              <td style={{ fontWeight: '700' }}>{monthlyPayable ? `Rs. ${Number(monthlyPayable).toLocaleString('en-IN')}` : '-'}</td>
                              <td style={{ fontWeight: '700' }}>{receivedAmt && receivedAmt !== '-' ? `Rs. ${Number(receivedAmt).toLocaleString('en-IN')}` : '-'}</td>
                              <td style={{ color: isPaid ? '#15803d' : '#94a3b8', fontWeight: isPaid ? '800' : 'normal', fontSize: '11px' }}>
                                {isPaid ? paidDate : '-'}
                              </td>
                              <td style={{ padding: '2px' }}>
                                <div className="signature-portrait-box">
                                  {isPaid && signatureSrc ? (
                                    <img src={signatureSrc} alt="Signature" crossOrigin="anonymous" />
                                  ) : null}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  {/* Portrait Passbook Footer */}
                  <div className="passbook-portrait-footer">
                    {/* Calendar Notice Box */}
                    <div className="passbook-calendar-box">
                      <span>📅</span>
                      <span>{config.footerRule || 'Every month 1 to 5 payable amount.'}</span>
                    </div>

                    {/* Auction Payout Box */}
                    {selectedCustomer.withdrawal && selectedCustomer.withdrawal.isWithdrawn ? (
                      <div className="portrait-payout-box">
                        🎉 Received installment auction payout of <strong>Rs. {selectedCustomer.withdrawal.amount ? Number(selectedCustomer.withdrawal.amount).toLocaleString('en-IN') : (schemeDetails.received ? Number(schemeDetails.received[0]).toLocaleString('en-IN') : '___')}</strong> on {selectedCustomer.withdrawal.withdrawDate || '___'}
                        {selectedCustomer.withdrawal.disbursedBy ? ` (Disbursed by ${selectedCustomer.withdrawal.disbursedBy})` : ''}
                      </div>
                    ) : (
                      <div className="portrait-payout-box" style={{ background: '#f8fafc', borderColor: '#cbd5e1', color: '#475569' }}>
                        Received ___ installment auction amount Rs. _______ on Date _________
                      </div>
                    )}

                    {/* Welcome / Version Divider */}
                    <div className="passbook-version-divider">
                      <span className="ornament">⚜️</span>
                      <span>{config.welcomeText || `Welcome to ${version}`}</span>
                      <span className="ornament">⚜️</span>
                    </div>

                    {/* Bottom Trust & Seal Line */}
                    <div className="portrait-bottom-seal">
                      <div>{config.subNote || 'JayanVijayan Chit Fund – Building Trust, Creating Wealth'}</div>
                      <div>Since {config.since || '2025'}</div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Action Buttons: High-Res JPG only */}
              <div className="passbook-actions-bar">
                <button
                  className="gold"
                  disabled={isDownloading}
                  onClick={() => handleDownload('jpg')}
                >
                  <span>📸</span>
                  <span>{isDownloading ? '⏳ Generating Passbook...' : 'Download Passbook (JPG)'}</span>
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // ADD CUSTOMER
    // ==========================================
    function AddCustomerView({ user, configs, selectedVersion, setSelectedVersion, coreReferrals, onCustomerAdded }) {
      const isPartnerAdmin = user.role === 'admin' && user.username !== 'admin';
      const [name, setName] = useState('');
      const [mobile, setMobile] = useState('');
      const [password, setPassword] = useState('1234');
      const [referral, setReferral] = useState(isPartnerAdmin ? user.referral : (coreReferrals[0] || 'PLSSV'));
      const [version, setVersion] = useState(selectedVersion);
      const [schemeType, setSchemeType] = useState('1000');

      const [isLoading, setIsLoading] = useState(false);
      const [msg, setMsg] = useState('');
      const [err, setErr] = useState('');

      const currentConfig = configs[version] || configs['JV_3.0'] || {};
      const availableSchemes = currentConfig.schemes ? Object.keys(currentConfig.schemes) : ['1000', '2500', '5000'];

      useEffect(() => {
        if (selectedVersion && selectedVersion !== 'Overall') {
          setVersion(selectedVersion);
        } else if (selectedVersion === 'Overall') {
          setVersion('JV_1.0');
        }
      }, [selectedVersion]);

      useEffect(() => {
        if (!availableSchemes.includes(schemeType)) {
          setSchemeType(availableSchemes[0] || '1000');
        }
      }, [version]);


      const handleSubmit = async (e) => {
        e.preventDefault();
        setMsg('');
        setErr('');
        setIsLoading(true);

        try {
          const res = await fetch('/api/customers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name,
              mobile,
              password,
              referral: isPartnerAdmin ? user.referral : referral,
              version,
              schemeType
            })
          });
          const data = await res.json();
          if (data.success) {
            setMsg('Customer registered successfully!');
            setName('');
            setMobile('');
            setPassword('1234');
            setSelectedVersion(version);
            setTimeout(() => {
              onCustomerAdded();
            }, 1200);
          } else {
            setErr(data.message || 'Failed to add customer');
          }
        } catch (e) {
          setErr('Server error connecting to API');
        }
        setIsLoading(false);
      };

      return (
        <div className="admin-card fade-in" style={{ maxWidth: '650px', margin: '0 auto' }}>
          <h2 className="admin-title">➕ Register New Customer</h2>
          <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
            <div className="form-grid">
              <div className="form-group">
                <label>Full Customer Name *</label>
                <input
                  type="text"
                  placeholder="e.g. Ramesh Kumar"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <label>Mobile Number *</label>
                <input
                  type="text"
                  placeholder="e.g. 9840011223"
                  value={mobile}
                  onChange={e => setMobile(e.target.value)}
                  required
                />
              </div>
            </div>

            <div className="form-grid">
              <div className="form-group">
                <label>Chit Scheme Version *</label>
                <select value={version} onChange={e => setVersion(e.target.value)}>
                  {Object.keys(configs).map(v => (
                    <option key={v} value={v}>{v}</option>
                  ))}
                </select>
              </div>

              <div className="form-group">
                <label>Chit Plan (Base Amount) *</label>
                <select value={schemeType} onChange={e => setSchemeType(e.target.value)}>
                  {availableSchemes.map(s => (
                    <option key={s} value={s}>Rs. {s} Plan</option>
                  ))}
                </select>
              </div>
            </div>

            <div className="form-group">
              <label>Referral Partner *</label>
              {isPartnerAdmin ? (
                <input
                  type="text"
                  value={user.referral}
                  disabled
                  style={{ background: '#f1f5f9', fontWeight: '800', color: '#0b1f3a' }}
                />
              ) : (
                <select value={referral} onChange={e => setReferral(e.target.value)}>
                  {coreReferrals.map(r => <option key={r} value={r}>{r}</option>)}
                </select>
              )}
            </div>

            {msg && <div style={{ color: '#15803d', background: '#dcfce7', padding: '10px', borderRadius: '8px', fontWeight: 'bold' }}>✅ {msg}</div>}
            {err && <div style={{ color: '#dc2626', background: '#fee2e2', padding: '10px', borderRadius: '8px', fontWeight: 'bold' }}>⚠️ {err}</div>}

            <button type="submit" disabled={isLoading} style={{ marginTop: '10px', padding: '12px', fontSize: '16px' }}>
              {isLoading ? 'Creating Account...' : 'Register Customer'}
            </button>
          </form>
        </div>
      );
    }

    // ==========================================
    // ADMIN PAYMENT UPDATES
    // ==========================================
    function AdminPaymentUpdatesView({ user, config, version, customers, coreReferrals, refreshData }) {
      const isPartnerAdmin = user.role === 'admin' && user.username !== 'admin';
      const [filterReferral, setFilterReferral] = useState(isPartnerAdmin ? user.referral : (coreReferrals[0] || 'PLSSV'));
      const filteredCustomers = customers.filter(c => (isPartnerAdmin ? c.referral === user.referral : (filterReferral === 'All' || c.referral === filterReferral)));

      const [selectedCustId, setSelectedCustId] = useState('');
      const [selectedMonthIndex, setSelectedMonthIndex] = useState(0);
      const [isPaid, setIsPaid] = useState(false);
      const [paidDate, setPaidDate] = useState(new Date().toISOString().split('T')[0]);
      const [isEditingPayment, setIsEditingPayment] = useState(false);

      const [isWithdraw, setIsWithdraw] = useState(false);
      const [withdrawDate, setWithdrawDate] = useState(new Date().toISOString().split('T')[0]);
      const [disbursedBy, setDisbursedBy] = useState(isPartnerAdmin ? user.referral : coreReferrals[0]);
      const [withdrawAmount, setWithdrawAmount] = useState(0);

      const [isLoading, setIsLoading] = useState(false);
      const [msg, setMsg] = useState('');

      useEffect(() => {
        if (filteredCustomers.length > 0) {
          if (!filteredCustomers.find(c => c.id === selectedCustId)) {
            setSelectedCustId(filteredCustomers[0].id);
          }
        } else {
          setSelectedCustId('');
        }
      }, [filterReferral, customers]);

      const currentCustomer = customers.find(c => c.id === selectedCustId);
      const isAlreadyWithdrawn = Boolean(currentCustomer && currentCustomer.withdrawal && currentCustomer.withdrawal.isWithdrawn);
      const currentPayRecord = currentCustomer && currentCustomer.payments && currentCustomer.payments[selectedMonthIndex];
      const isAlreadyPaid = Boolean(currentPayRecord && currentPayRecord.isPaid);

      useEffect(() => {
        if (!currentCustomer) return;
        const pay = currentCustomer.payments && currentCustomer.payments[selectedMonthIndex];
        if (pay && pay.isPaid) {
          setIsPaid(true);
          setPaidDate(pay.paidDate || new Date().toISOString().split('T')[0]);
          setIsEditingPayment(false); // Lock fields by default if already paid
        } else {
          setIsPaid(false);
          setPaidDate(new Date().toISOString().split('T')[0]);
          setIsEditingPayment(true); // Open for editing if unpaid
        }

        if (currentCustomer.withdrawal && currentCustomer.withdrawal.isWithdrawn) {
          setIsWithdraw(true);
          setWithdrawDate(currentCustomer.withdrawal.withdrawDate || new Date().toISOString().split('T')[0]);
          setDisbursedBy(currentCustomer.withdrawal.disbursedBy || currentCustomer.referral);
          setWithdrawAmount(currentCustomer.withdrawal.amount || 0);
        } else {
          setIsWithdraw(false);
          setWithdrawDate(new Date().toISOString().split('T')[0]);
          setDisbursedBy(currentCustomer.referral);
          const scheme = config.schemes[currentCustomer.schemeType] || Object.values(config.schemes)[0];
          setWithdrawAmount(scheme && scheme.received ? scheme.received[selectedMonthIndex] : 0);
        }
      }, [selectedCustId, selectedMonthIndex, customers]);

      const handleSavePayment = async (e) => {
        e.preventDefault();
        if (!selectedCustId) return;
        setIsLoading(true);
        setMsg('');

        try {
          await fetch('/api/payments/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              version,
              customerId: selectedCustId,
              monthIndex: selectedMonthIndex,
              isPaid,
              paidDate
            })
          });

          if (!isAlreadyWithdrawn) {
            await fetch('/api/withdrawals/update', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                version,
                customerId: selectedCustId,
                isWithdrawn: isWithdraw,
                withdrawDate,
                disbursedBy,
                amount: parseFloat(withdrawAmount) || 0
              })
            });

            if (isWithdraw && currentCustomer) {
              await fetch('/api/accounts/disbursals', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  version,
                  monthIndex: selectedMonthIndex,
                  customerId: selectedCustId,
                  customerName: currentCustomer.name,
                  disbursedBy,
                  amount: parseFloat(withdrawAmount) || 0,
                  date: withdrawDate,
                  notes: `Auction payout for Month ${selectedMonthIndex + 1}`
                })
              });
            }
          }

          setMsg('Record updated successfully!');
          setIsEditingPayment(false);
          refreshData();
          setTimeout(() => setMsg(''), 3000);
        } catch (e) {
          alert("Error updating record");
        }
        setIsLoading(false);
      };

      const handleDeleteCustomer = async () => {
        if (!selectedCustId) return;
        if (!confirm(`Are you sure you want to delete ${currentCustomer?.name}?`)) return;

        try {
          await fetch('/api/customers', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ version, customerId: selectedCustId })
          });
          setMsg('Customer removed');
          refreshData();
        } catch (e) {
          alert("Error deleting customer");
        }
      };

      return (
        <div className="admin-card fade-in" style={{ maxWidth: '700px', margin: '0 auto' }}>
          <h2 className="admin-title">✍️ Manage Payments & Auction Disbursals ({version})</h2>

          {!isPartnerAdmin && (
            <div className="form-group" style={{ marginBottom: '16px', background: '#f8fafc', padding: '12px', borderRadius: '8px', border: '1px solid #e2e8f0' }}>
              <label style={{ color: '#0b1f3a' }}>Filter by Person:</label>
              <select value={filterReferral} onChange={e => setFilterReferral(e.target.value)}>
                {coreReferrals.map(r => <option key={r} value={r}>{r}</option>)}
                <option value="All">All Persons</option>
              </select>
            </div>
          )}

          {filteredCustomers.length === 0 ? (
            <div style={{ color: '#dc2626', fontWeight: 'bold', padding: '20px 0' }}>No customers found for this person</div>
          ) : (
            <form onSubmit={handleSavePayment} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div className="form-group">
                <label>Select Customer:</label>
                <select value={selectedCustId} onChange={e => setSelectedCustId(e.target.value)}>
                  {filteredCustomers.map(c => (
                    <option key={c.id} value={c.id}>
                      {c.name} — Rs.{c.schemeType} ({c.referral})
                    </option>
                  ))}
                </select>
              </div>

              <div className="form-group">
                <label>Installment Month:</label>
                <select value={selectedMonthIndex} onChange={e => setSelectedMonthIndex(parseInt(e.target.value))}>
                  {config.months && config.months.map((mObj, idx) => (
                    <option key={idx} value={idx}>
                      Month {idx + 1}: {mObj.name}
                    </option>
                  ))}
                </select>
              </div>

              {/* RECORD PAYMENT SECTION WITH DISABLE & EDIT BUTTON LOGIC */}
              <div style={{ padding: '16px', background: isAlreadyPaid && !isEditingPayment ? '#f8fafc' : '#f0fdf4', borderRadius: '10px', border: `1.5px solid ${isAlreadyPaid && !isEditingPayment ? '#cbd5e1' : '#bbf7d0'}` }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                    <input
                      type="checkbox"
                      id="paidCheck"
                      checked={isPaid}
                      disabled={isAlreadyPaid && !isEditingPayment}
                      onChange={e => setIsPaid(e.target.checked)}
                      style={{ width: '22px', height: '22px', cursor: (isAlreadyPaid && !isEditingPayment) ? 'not-allowed' : 'pointer' }}
                    />
                    <label htmlFor="paidCheck" style={{ fontSize: '16px', fontWeight: '800', color: isPaid ? '#15803d' : '#334155', cursor: (isAlreadyPaid && !isEditingPayment) ? 'not-allowed' : 'pointer' }}>
                      {isPaid ? '✅ Mark as Paid' : '⭕ Unpaid (Click to Mark Paid)'}
                    </label>
                  </div>

                  {/* EDIT PAYMENT BUTTON WHEN LOCKED */}
                  {isAlreadyPaid && !isEditingPayment && (
                    <button
                      type="button"
                      className="tabbtn active"
                      onClick={() => setIsEditingPayment(true)}
                      style={{ background: '#0284c7', color: '#ffffff', border: 'none', padding: '6px 14px', fontSize: '12px', borderRadius: '8px' }}
                    >
                      ✏️ Edit Payment Date / Status
                    </button>
                  )}
                </div>

                {isAlreadyPaid && !isEditingPayment && (
                  <div style={{ fontSize: '12px', color: '#64748b', marginTop: '8px', fontWeight: '600' }}>
                    🔒 Customer payment is locked. Click <strong>"✏️ Edit Payment Date / Status"</strong> above to make changes.
                  </div>
                )}

                {isPaid && (() => {
                  const colMonthIdx = (typeof window.getSchemeMonthFromDate === 'function')
                    ? (window.getSchemeMonthFromDate(paidDate, version) ?? selectedMonthIndex)
                    : selectedMonthIndex;
                  const colMonthObj = (config.months && config.months[colMonthIdx]) || { name: `Month ${colMonthIdx + 1}` };
                  const isAdvance = colMonthIdx !== selectedMonthIndex;

                  return (
                    <div style={{ marginTop: '12px' }}>
                      <label style={{ fontSize: '13px', fontWeight: '700' }}>Credit Received Date: *</label>
                      <input
                        type="date"
                        value={paidDate}
                        disabled={isAlreadyPaid && !isEditingPayment}
                        onChange={e => setPaidDate(e.target.value)}
                        required
                        style={{ background: (isAlreadyPaid && !isEditingPayment) ? '#f1f5f9' : '#ffffff' }}
                      />
                      <div style={{
                        marginTop: '8px',
                        padding: '8px 12px',
                        borderRadius: '8px',
                        background: isAdvance ? '#fef3c7' : '#f0fdf4',
                        border: `1.5px solid ${isAdvance ? '#f59e0b' : '#86efac'}`,
                        fontSize: '12px',
                        fontWeight: '700',
                        color: isAdvance ? '#b45309' : '#15803d',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '6px'
                      }}>
                        <span>{isAdvance ? '⚡' : '📅'}</span>
                        <span>
                          <strong>Balance Sheet Attribution:</strong> Credited to <strong>Month {colMonthIdx + 1}: {colMonthObj.name}</strong> Collections
                          {isAdvance && ' (Advance Collection based on Payment Date)'}
                        </span>
                      </div>
                    </div>
                  );
                })()}
              </div>

              <div style={{ padding: '16px', background: isAlreadyWithdrawn ? '#f1f5f9' : '#fef2f2', borderRadius: '10px', border: `1.5px solid ${isAlreadyWithdrawn ? '#cbd5e1' : '#fecaca'}` }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                  <input
                    type="checkbox"
                    id="withCheck"
                    checked={isWithdraw}
                    disabled={isAlreadyWithdrawn}
                    onChange={e => !isAlreadyWithdrawn && setIsWithdraw(e.target.checked)}
                    style={{ width: '22px', height: '22px', cursor: isAlreadyWithdrawn ? 'not-allowed' : 'pointer' }}
                  />
                  <label htmlFor="withCheck" style={{ fontSize: '15px', fontWeight: '800', color: isAlreadyWithdrawn ? '#64748b' : (isWithdraw ? '#b91c1c' : '#334155'), cursor: isAlreadyWithdrawn ? 'not-allowed' : 'pointer' }}>
                    {isAlreadyWithdrawn ? '🔒 Auction Payout Already Recorded (Locked)' : '🏷️ Record Auction Payout (Withdrawn)'}
                  </label>
                </div>

                {isWithdraw && (
                  <div style={{ marginTop: '12px', display: 'flex', flexDirection: 'column', gap: '10px', opacity: isAlreadyWithdrawn ? 0.8 : 1 }}>
                    <div>
                      <label style={{ fontSize: '13px', fontWeight: '700' }}>Payout Date:</label>
                      <input
                        type="date"
                        value={withdrawDate}
                        disabled={isAlreadyWithdrawn}
                        onChange={e => setWithdrawDate(e.target.value)}
                        required
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: '13px', fontWeight: '700' }}>Disbursed By Person:</label>
                      {isAlreadyWithdrawn ? (
                        <input type="text" value={disbursedBy} disabled style={{ background: '#f8fafc', fontWeight: '700' }} />
                      ) : (
                        <select value={disbursedBy} onChange={e => setDisbursedBy(e.target.value)}>
                          {coreReferrals.map(r => <option key={r} value={r}>{r}</option>)}
                        </select>
                      )}
                    </div>
                    <div>
                      <label style={{ fontSize: '13px', fontWeight: '700' }}>Disbursed Amount (Rs.):</label>
                      <input
                        type="number"
                        value={withdrawAmount}
                        disabled={isAlreadyWithdrawn}
                        onChange={e => setWithdrawAmount(e.target.value)}
                        required
                      />
                    </div>
                    {isAlreadyWithdrawn && (
                      <div style={{ fontSize: '12px', fontWeight: '700', color: '#64748b', marginTop: '4px' }}>
                        ℹ️ This customer's auction payout has already been recorded and cannot be edited.
                      </div>
                    )}
                  </div>
                )}
              </div>

              {msg && <div style={{ color: '#15803d', background: '#dcfce7', padding: '10px', borderRadius: '8px', fontWeight: 'bold' }}>✅ {msg}</div>}

              <div style={{ display: 'flex', gap: '12px', marginTop: '10px' }}>
                <button type="submit" disabled={isLoading} style={{ flex: 1, padding: '12px' }}>
                  {isLoading ? 'Saving...' : '💾 Save Record'}
                </button>
                <button type="button" className="danger" onClick={handleDeleteCustomer} style={{ padding: '12px' }}>
                  🗑️ Delete
                </button>
              </div>
            </form>
          )}
        </div>
      );
    }

    // ==========================================
    // REPORTS VIEW
    // ==========================================
    function ReportsView({ user, config, version, coreReferrals }) {
      const [reportData, setReportData] = useState(null);
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        setIsLoading(true);
        fetch(`/api/reports?version=${version}`)
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              setReportData(data);
            }
          })
          .catch(e => console.error("Error fetching reports", e))
          .finally(() => setIsLoading(false));
      }, [version]);

      if (isLoading) {
        return <div style={{ textAlign: 'center', padding: '50px', fontSize: '18px' }}>Loading Financial Report...</div>;
      }

      if (!reportData) {
        return <div style={{ textAlign: 'center', padding: '50px' }}>No report data available</div>;
      }

      const totalOverallCollection = (reportData.monthlyStats || []).reduce((acc, m) => acc + m.totalCollection, 0);

      return (
        <div className="fade-in">
          <div style={{ textAlign: 'center', marginBottom: '22px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: '900', color: '#0b1f3a' }}>
              📊 {config.title || 'JayanVijayan Chit Fund'} — {version} Report
            </h2>
            <div style={{ display: 'flex', justifyContent: 'center', gap: '18px', marginTop: '14px', flexWrap: 'wrap' }}>
              <div style={{ background: '#dcfce7', padding: '10px 22px', borderRadius: '12px', fontWeight: '800', color: '#15803d', fontSize: '16px' }}>
                💰 Total Collections: Rs. {totalOverallCollection.toLocaleString('en-IN')}
              </div>
              <div style={{ background: '#fee2e2', padding: '10px 22px', borderRadius: '12px', fontWeight: '800', color: '#b91c1c', fontSize: '16px' }}>
                🎉 Total Withdrawals: {reportData.totalWithdrawals} Members
              </div>
              <div style={{ background: '#e0f2fe', padding: '10px 22px', borderRadius: '12px', fontWeight: '800', color: '#0369a1', fontSize: '16px' }}>
                👥 Total Members: {reportData.totalCustomers}
              </div>
            </div>
          </div>

          <div className="passbook-table-container">
            <table className="passbook-table">
              <thead>
                <tr>
                  <th rowSpan="2" style={{ width: '50px' }}>#</th>
                  <th rowSpan="2">Month</th>
                  <th style={{ backgroundColor: '#047857', color: '#ffffff', fontSize: '14px' }}>Month Total</th>
                  <th colSpan={coreReferrals.length} style={{ backgroundColor: '#1e40af', color: '#ffffff', fontSize: '14px' }}>
                    Referral Split
                  </th>
                </tr>
                <tr>
                  <th style={{ backgroundColor: '#059669', color: '#ffffff' }}>Collections (Rs.)</th>
                  {coreReferrals.map(r => (
                    <th key={r} style={{ backgroundColor: '#2563eb', fontSize: '13px' }}>{r}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {reportData.monthlyStats && reportData.monthlyStats.map((item, idx) => (
                  <tr key={idx}>
                    <td style={{ fontWeight: '700' }}>{idx + 1}</td>
                    <td style={{ fontWeight: '800' }}>{item.monthName || item.monthEn || `Month ${idx+1}`}</td>
                    <td style={{ color: '#15803d', fontWeight: '900' }}>
                      {item.totalCollection > 0 ? `Rs. ${item.totalCollection.toLocaleString('en-IN')}` : '-'}
                    </td>
                    {coreReferrals.map(r => {
                      const amount = item.referralSplit[r] || 0;
                      return (
                        <td key={r} style={{ color: amount > 0 ? '#1d4ed8' : '#94a3b8', fontWeight: amount > 0 ? '700' : 'normal' }}>
                          {amount > 0 ? `Rs. ${amount.toLocaleString('en-IN')}` : '-'}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
